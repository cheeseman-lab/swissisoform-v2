# The LLM-tuning coreset: 50 isoforms across 40 genes.
#
# Explicit [[isoforms]] picks, like cheeseman13 — each entry's
# (tid, genome_pos, start_codon) is matched against the combined catalog to pull
# its sequence, and the canonical Annotated rows for these genes are kept
# automatically. Runs multi-sample.
#
# Composition:
#   22 anchors        hand-curated, static
#   12 rare-type fill  n=1 sampler within each of
#                  uorf / internal_oof / 3utr_orf / uoorf — the four types
#                  the global sampler never reaches, being 0.3-4.9% of the
#                  pool. Yields each type's max, min and most typical.
#   16 per-type sampler  extended and truncated, each
#                  sampled in its own paired-ORF MFA space (every feature,
#                  unique-vs-shared contrasts included), one isoform per gene.
#
# Built 2026-10-14T18:41:31+00:00 at commit 85d6107b8eb0+dirty from:
#   /lab/barcheese01/ating/swissisoform-v2/data/output/full_catalog_20261009/all_paired.parquet  sha256 d4ca114eb3143fdd
#   figures/clustering_dims/feature_space/feature_catalog.csv  sha256 ddb1270363c73505
# Full record: figures/clustering_dims/principled_sampling/coreset_provenance.json
#
# ORF types: Extended 20, Truncated 17, uoORF 4, uORF 3, internal out-of-frame 3, 3'UTR ORF 3
#
# Regenerate with figures/clustering_dims/principled_sampling/write_preset.py
# after rebuilding coreset_50.csv.
run_name = "cheeseman50"

# Production reproducibility bar, matching cheeseman13. At 1 every TIS passes D1
# by construction, handing the LLM a criterion that is True everywhere.
min_cell_lines = 3

