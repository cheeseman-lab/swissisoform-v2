<div class="evidence-tile axis-{{ c.axis }}" data-criterion="{{ c.id }}" title="{{ sl.reason or '' }}">
  <button class="tile-head" type="button" aria-haspopup="dialog">
    <span class="tile-id">{{ c.id.split('_')[0] }}</span>
    <span class="tile-label">{{ c.label }}</span>
    <span class="tile-badge tile-badge-{{ 'true' if sl.value == true else ('false' if sl.value == false else 'none') }}">
      {% if sl.value == true %}✓{% elif sl.value == false %}✗{% else %}–{% endif %}
    </span>
  </button>
  <div class="tile-headline">
    {% if sl.headline is none %}
      <span class="text-xs text-slate-400">—</span>
    {% else %}
      {{ sl.headline }}
    {% endif %}
  </div>
  {# Body content stored as a <template> fragment — never rendered inline.
     JS clones the contents into the evidence modal on tile click. #}
  <template class="tile-body-template">
    {% if sl.interpretation_hint %}
      <p class="tile-hint">
        <span class="tile-hint-icon">i</span>
        {{ sl.interpretation_hint }}
      </p>
    {% endif %}
    {% if llm %}
      <div class="tile-llm">
        <p class="rp-headline"><strong>{{ llm.headline }}</strong></p>
        <p class="rp-summary">{{ llm.summary }}</p>
      </div>
    {% else %}
      <p class="empty tile-llm-empty">Criterion LLM summary not yet generated.</p>
    {% endif %}
    {% set ce = criterion_evidence.get(c.id) if criterion_evidence else none %}
    {% include "_criterion_evidence.html" %}
    <details class="tile-metrics">
      <summary>Metrics ({{ sl.evidence|length }})</summary>
      <table class="metrics-table">
        <tbody>
          {% for k, v in sl.evidence.items() %}
          {% set meta = CRITERIA_METRIC_LABELS.get(k, {}) %}
          <tr>
            <th>{{ meta.label if meta.label else k }}</th>
            <td class="metric-val">
              {% if v is none %}<span class="text-slate-400">—</span>
              {% else %}{{ format_metric(v, meta.format if meta.format else 'str') }}
              {% endif %}
            </td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </details>
    {% if sl.hits %}
      <details class="tile-hits">
        <summary>Hits ({{ sl.hits|length }})</summary>
        <ul class="hits-list">
          {% for h in sl.hits[:20] %}
            <li>
              {% if h.variant_id %}
                {% set h_aa_ref = h.isoform_aa_ref if h.isoform_aa_ref is not none else h.aa_ref %}
                {% set h_aa_alt = h.isoform_aa_alt if h.isoform_aa_alt is not none else h.aa_alt %}
                {% set h_url = variant_url(h.variant_id, h.source, (h.metadata.rs_id if h.metadata else none)) %}
                {% if h.source %}<span class="var-badge var-badge-{{ h.source|lower }}">{{ h.source }}</span> {% endif %}
                {% if h_url %}<a href="{{ h_url }}" target="_blank" rel="noopener">{{ h.variant_id }}</a>{% else %}{{ h.variant_id }}{% endif %}
                {% if h_aa_ref or h_aa_alt %} · {{ h_aa_ref or '?' }}→{{ h_aa_alt or '?' }}{% endif %}
                {% if h.clinical_significance %} · {{ h.clinical_significance }}{% endif %}
                {% if h.allele_frequency is not none %} · AF {{ '%.1e'|format(h.allele_frequency|float) }}{% endif %}
              {% elif h.peptide %}
                {{ h.peptide }} ({{ h.length or h.peptide|length }} aa, pos {{ h.pos }}–{{ h.end }})
              {% elif h.name or h.description %}
                {{ h.name or h.description }}{% if h.start is defined and h.end is defined %} · {{ h.start }}–{{ h.end }}{% endif %}{% if h.db %} · {{ h.db }}{% endif %}
              {% else %}
                {{ h|tojson }}
              {% endif %}
            </li>
          {% endfor %}
        </ul>
      </details>
    {% endif %}
  </template>
</div>
