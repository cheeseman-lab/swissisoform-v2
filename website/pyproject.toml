[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "swissisoform-site"
version = "0.1.0"
description = "Flask viewer for SwissIsoform v2 paired-evidence parquet + LLM interpretations"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "Matteo DiBernardo"}
]

dependencies = [
    "flask>=3.0",
    "gunicorn>=21.2",
    "pandas>=2.0",
    "pyarrow>=15.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
swissisoform_site = [
    "templates/*.html",
    "static/css/*.css",
    "static/js/*.js",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
