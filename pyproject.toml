[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "swissisoform"
version = "2.0.0"
description = "Analysis pipeline for alternative protein isoforms from translation initiation sequencing"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12,<3.13"
dependencies = [
    # >=1.26 (not >=2.0) so the [fold] env can co-resolve boltz, which pins
    # numpy<2.0; the main env still gets numpy 2.x. The package runs on both.
    "numpy>=1.26",
    "pandas>=2.0.0",
    "pyarrow>=15.0.0",
    "biopython>=1.83",
    "pysam>=0.22.0",
    "pyfaidx>=0.8",
    "pyBigWig>=0.3.22",
    "requests>=2.31.0",
    "pyyaml>=6.0",
    # Validates the LLM passes' structured output against
    # scripts/site/prompts/output_schemas/*.json. A runtime dep, not dev-only:
    # the LLM stage runs in production website builds, which is exactly where an
    # unchecked output contract matters. Small and pure-Python bar rpds-py,
    # which ships wheels.
    "jsonschema>=4.0",
    "tmtools>=0.3.0",
    "biotite>=1.0",
    # LLM stage. Floor is where strict tool schemas were verified.
    "anthropic>=0.116.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
    "pytest-cov>=5.0.0",
    "openpyxl>=3.1",
    # diagnostics-only: the source-divergence distribution plot
    # (figures/source_divergence/export_source_divergence_distribution.py). Lazy-imported,
    # so the library + tests do not require it.
    "matplotlib>=3.7",
]
fold = [
    # Pinned to base's exact torch; chai_lab wants >=2.3.1,<2.7 and boltz >=2.2,
    # so the range allowed drift — a rebuild landed 2.14+cu130, past both.
    # Single forward pass per protein → no fused kernel; don't add xformers here.
    "torch==2.6.0",
    # The ESMFold2 stack, previously undeclared here: esm supplies the featurizer
    # and mmCIF decoder, and pulls the Biohub transformers fork that owns
    # ESMFold2Model. Mainline transformers renamed it EsmFold2Model and changed
    # forward's signature, so an unpinned resolve breaks structure/esmfold2.py —
    # and Biohub still publishes fork-format checkpoints, so there is nothing to
    # upgrade to. Same pin as [plm]: one env's structures must match the other's.
    "esm @ git+https://github.com/evolutionaryscale/esm.git@14d382908b595cd4bfb19394ec8d0d6b4e4b9abb",
    "boltz>=2.2",
    "chai_lab>=0.6",  # second structure backend (run_fold.sbatch <fasta> chai)
]
judge = [
    # Serving Prometheus-8x7B (Mixtral 8x7B) as a local judge for the
    # prompt-variant evaluation. Its own env because vLLM pins its own torch:
    # this env runs torch 2.10 while the annotation envs pin 2.6.0, and moving
    # theirs would shift the residual stream the cached SAE features were
    # produced with.
    #
    # Pinned, not floated. `vllm>=0.6.0` resolves to 0.29.0, which pins
    # torch==2.13.0 and nvidia-cutlass-dsl[cu13]; CUDA 13 wheels need driver
    # >=580 and the A6000s/A100s here report 560.35.03 (CUDA 12.6), so the env
    # installs and then cannot load a model. Every vllm from 0.20.0 up sits on a
    # cu13 torch; 0.19.1 is the newest on a cu12 torch (2.10.0) with no cu13
    # dependency anywhere. Raise only after the driver moves.
    "vllm==0.19.1",
    # Served in bf16 on 2x A100-80: 88 GB of weights across 160 GB leaves ~68 GB
    # for KV cache, and Mixtral's KV is 128 KB/token, so ~34 concurrent 16k
    # requests. No quantization -- 4-bit on one A6000 would give ~10, and the
    # collaborator who has run this model on this cluster ran bf16 with
    # tensor_parallel_size=2.
    #
    # The official prompt templates, so prompts.py can be pinned against them
    # rather than trusted. Not used at runtime -- the request builder runs in the
    # base env -- but a test asserts equality wherever this package is
    # importable, and it caught a paraphrase on the first run.
    "prometheus-eval>=0.1.20",
    # pytest so those assertions can run in *this* env; the base env's [dev]
    # extra cannot see prometheus_eval.
    "pytest>=8.0.0",
    # Produces the optional 4-bit copy (judge/quantize.py). It lives here rather
    # than in its own env for two measured reasons:
    #
    #   1. A separate env resolves torch 2.14.0+cu130, which cannot initialise on
    #      this driver ("NVIDIA driver too old (found version 12060)") -- so it
    #      could not have quantized on a GPU at all. Here it inherits this env's
    #      working torch 2.10.0+cu128.
    #   2. vLLM pins compressed-tensors==0.15.0.1 and llmcompressor wants >=0.18,
    #      which looks irreconcilable -- but vLLM imports and registers
    #      `compressed-tensors` fine at 0.18.0 (verified on an A6000). Sharing one
    #      env means the same library writes and reads the weights, which removes
    #      the format-compatibility question a split env would have created.
    #
    # It does drag transformers to 5.14.1 (from 5.17.0); still inside vLLM's
    # >=4.56.0, and the sanity anchors were re-run to confirm the judge is unchanged.
    "llmcompressor>=0.13.0",
]
plm = [
    # torch <2.7 = CUDA-12 wheel (A6000 ≈ CUDA 12.6; cu13x needs a newer driver).
    "torch>=2.2.0,<2.7",
    # ESM-C embed + SAE encode, and the ESMFold2 backend. `esm` pulls the Biohub
    # transformers fork, which is the ONLY source of transformers.models.esmc,
    # modeling_esmc_sae and esmfold2 — mainline transformers ships none of them.
    # Pinned to the commit whose numerics the cached embeddings and SAE features
    # were produced with; moving it shifts the residual stream the SAE reads.
    # (fair-esm, the ESM-2 package, was dropped here — nothing imports it since
    # the ESM-C migration, and installing it is what left this env unable to run
    # the embed at all.)
    "esm @ git+https://github.com/evolutionaryscale/esm.git@14d382908b595cd4bfb19394ec8d0d6b4e4b9abb",
    # xformers = fused attention for ESM-C's LLR sweep (the GPU bottleneck),
    # ~1.3-2x faster embed vs pure-PyTorch fallback. Pinned to resolve against
    # torch 2.6.0. Never swap kernels mid-run — it shifts the residual stream the
    # SAE reads and corrupts SAE features. flash-attn is opt-in (GPU-node source
    # build): scripts/setup/create_envs.sh --plm --flash.
    "xformers==0.0.29.post3",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "D"]
# D403: biology terms are case-sensitive (pI, uORF, gnomAD, mRNA) — don't auto-capitalize.
ignore = ["D403"]
pydocstyle = { convention = "google" }

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["D100", "D101", "D102", "D103", "D205"]
"scripts/*.py" = ["D103"]
# `pysam` appears only in a quoted type annotation (lazy-imported in-function).
"src/swissisoform/setup/databases.py" = ["D103", "F821"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: requires GPU (structure prediction, embeddings)",
    "network: requires network access (API calls, downloads)",
]
addopts = "-m 'not gpu and not network' --tb=short -q"
