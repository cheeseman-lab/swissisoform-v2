[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "swissisoform"
version = "2.0.0"
description = "Analysis pipeline for alternative protein isoforms from translation initiation sequencing"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0.0",
    "pandas>=2.0.0",
    "pyarrow>=15.0.0",
    "biopython>=1.83",
    "pysam>=0.22.0",
    "pyfaidx>=0.8",
    "pyBigWig>=0.3.22",
    "requests>=2.31.0",
    "pyyaml>=6.0",
    "tmtools>=0.3.0",
    "biotite>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
    "pytest-cov>=5.0.0",
    "openpyxl>=3.1",
]
fold = [
    "torch>=2.0.0",
    # ESMFold2 (default structure backend) — EvolutionaryScale `esm`, pinned to the
    # commit validated on GPU; it pulls the Biohub `transformers` fork itself (the fork
    # registers esmfold2/esmc). Build on a GPU node: `uv pip install -e '.[fold]'`.
    "esm @ git+https://github.com/evolutionaryscale/esm.git@14d382908b595cd4bfb19394ec8d0d6b4e4b9abb",
    # Secondary backends (still selectable via run_fold.sbatch ... <backend>); install
    # alongside as needed — coexistence with `esm` in one env is not yet smoke-tested:
    # "boltz>=2.2",   # run_fold.sbatch ... boltz
    # "chai_lab",     # run_fold.sbatch ... chai
]
plm = [
    "torch>=2.0.0",
    # ESM-C (replaces ESM-2 / fair-esm) — loaded via the Biohub `transformers` fork,
    # pinned to the commit validated for the ESM-C delta-LLR cache.
    "transformers @ git+https://github.com/Biohub/transformers.git@ef32577f55da19a4989cd7b22e004dc43a4998cb",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "D"]
# D403: biology terms are case-sensitive (pI, uORF, gnomAD, mRNA) — don't auto-capitalize.
ignore = ["D403"]
pydocstyle = { convention = "google" }

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["D100", "D101", "D102", "D103", "D205"]
"scripts/*.py" = ["D103"]
# `pysam` appears only in a quoted type annotation (lazy-imported in-function).
"src/swissisoform/setup/databases.py" = ["D103", "F821"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: requires GPU (structure prediction, embeddings)",
    "network: requires network access (API calls, downloads)",
]
addopts = "-m 'not gpu and not network' --tb=short -q"
