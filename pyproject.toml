[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "swissisoform"
version = "2.0.0"
description = "Analysis pipeline for alternative protein isoforms from translation initiation sequencing"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0.0",
    "pandas>=2.0.0",
    "pyarrow>=15.0.0",
    "biopython>=1.83",
    "pysam>=0.22.0",
    "pyfaidx>=0.8",
    "pyBigWig>=0.3.22",
    "requests>=2.31.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
    "pytest-cov>=5.0.0",
]
gpu = [
    "torch>=2.0.0",
]

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["swissisoform", "swissisoform.modules", "swissisoform.compare", "swissisoform.io", "swissisoform.plm", "swissisoform.structure"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "D"]
# D403: biology terms are case-sensitive (pI, uORF, gnomAD, mRNA) — don't auto-capitalize.
ignore = ["D403"]
pydocstyle = { convention = "google" }

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["D100", "D101", "D102", "D103", "D205"]
"scripts/*.py" = ["D103"]
# setup_databases.py loads .env before `from typing import Any` by design.
# `pysam` appears only in a quoted type annotation.
"scripts/setup_databases.py" = ["D103", "E402", "F821"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: requires GPU (structure prediction, embeddings)",
    "network: requires network access (API calls, downloads)",
]
addopts = "-m 'not gpu and not network' --tb=short -q"
