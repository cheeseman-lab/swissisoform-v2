[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "swissisoform"
version = "2.0.0"
description = "Analysis pipeline for alternative protein isoforms from translation initiation sequencing"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12,<3.13"
dependencies = [
    # >=1.26 (not >=2.0) so the [fold] env can co-resolve boltz, which pins
    # numpy<2.0; the main env still gets numpy 2.x. The package runs on both.
    "numpy>=1.26",
    "pandas>=2.0.0",
    "pyarrow>=15.0.0",
    "biopython>=1.83",
    "pysam>=0.22.0",
    "pyfaidx>=0.8",
    "pyBigWig>=0.3.22",
    "requests>=2.31.0",
    "pyyaml>=6.0",
    # Validates the LLM passes' structured output against
    # scripts/site/prompts/output_schemas/*.json. A runtime dep, not dev-only:
    # the LLM stage runs in production website builds, which is exactly where an
    # unchecked output contract matters. Small and pure-Python bar rpds-py,
    # which ships wheels.
    "jsonschema>=4.0",
    "tmtools>=0.3.0",
    "biotite>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
    "pytest-cov>=5.0.0",
    "openpyxl>=3.1",
    # diagnostics-only: the source-divergence distribution plot
    # (figures/source_divergence/export_source_divergence_distribution.py). Lazy-imported,
    # so the library + tests do not require it.
    "matplotlib>=3.7",
]
fold = [
    # chai_lab pins torch>=2.3.1,<2.7; boltz needs >=2.2 — this satisfies both.
    # Single forward pass per protein → no fused kernel; don't add xformers here.
    "torch>=2.3.1,<2.7",
    "boltz>=2.2",
    "chai_lab>=0.6",  # second structure backend (run_fold.sbatch <fasta> chai)
]
plm = [
    # torch <2.7 = CUDA-12 wheel (A6000 ≈ CUDA 12.6; cu13x needs a newer driver).
    "torch>=2.2.0,<2.7",
    "fair-esm>=2.0",
    # xformers = fused attention for ESM-C's LLR sweep (the GPU bottleneck),
    # ~1.3-2x faster embed vs pure-PyTorch fallback. Pinned to resolve against
    # torch 2.6.0. Never swap kernels mid-run — it shifts the residual stream the
    # SAE reads and corrupts SAE features. flash-attn is opt-in (GPU-node source
    # build): scripts/setup/create_envs.sh --plm --flash.
    "xformers==0.0.29.post3",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "D"]
# D403: biology terms are case-sensitive (pI, uORF, gnomAD, mRNA) — don't auto-capitalize.
ignore = ["D403"]
pydocstyle = { convention = "google" }

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["D100", "D101", "D102", "D103", "D205"]
"scripts/*.py" = ["D103"]
# `pysam` appears only in a quoted type annotation (lazy-imported in-function).
"src/swissisoform/setup/databases.py" = ["D103", "F821"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: requires GPU (structure prediction, embeddings)",
    "network: requires network access (API calls, downloads)",
]
addopts = "-m 'not gpu and not network' --tb=short -q"
